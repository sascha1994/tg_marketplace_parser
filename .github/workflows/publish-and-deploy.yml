name: Test and publish image

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run ruff linter
        run: python -m ruff check .
      - name: Run mypy type check
        run: python -m mypy tg_marketplace_parser
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q tg_marketplace_parser tests

  publish:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/sascha1994/tg_marketplace_parser"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${SHA}"
            if [[ "$REF" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            elif [[ "$REF" =~ ^refs/heads/release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "${image}:${BASH_REMATCH[1]}"
            else
              echo "Unsupported publishing branch: $REF" >&2
              exit 1
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
