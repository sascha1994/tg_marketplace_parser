name: Test and publish image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main


permissions:
  contents: read

concurrency:
  group: parser-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run ruff linter
        run: python -m ruff check .
      - name: Run mypy type check
        run: python -m mypy tg_marketplace_parser
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q tg_marketplace_parser tests

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/sascha1994/tg_marketplace_parser
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release version and ancestry
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test "$TAG" = "v$(python -c 'from tg_marketplace_parser import __version__; print(__version__)')"
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v3
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parser:release
          cache-from: type=gha,scope=parser-image
          cache-to: type=gha,mode=max,scope=parser-image
      - name: Smoke test Chromium inside the release image
        run: |
          docker run --rm -i --network none parser:release python - <<'PY'
          import parser
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          page_file = Path("/tmp/smoke.html")
          page_file.write_text("<title>release smoke</title>")
          with sync_playwright() as pw:
              browser = pw.chromium.launch(channel="chromium")
              page = browser.new_page()
              page.goto(page_file.as_uri())
              assert page.title() == "release smoke"
              browser.close()
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${TAG#v}"
          ref="$IMAGE:$version"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "Version $version already exists" >&2
            exit 1
          fi
          docker tag parser:release "$ref"
          docker tag parser:release "$IMAGE:sha-$GITHUB_SHA"
          docker push "$ref"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$IMAGE@$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"
          printf 'Image: `%s`\n' "$digest" > /tmp/release.md
          if test -f "releases/$TAG.md"; then
            cat "releases/$TAG.md" >> /tmp/release.md
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-file /tmp/release.md

  stable:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-stable.yml
