name: Publish 1.0.7 admin backport

on:
  push:
    tags:
      - 'v1.0.7-admin.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sascha1994/tg_marketplace_parser
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build backport from pinned runtime
        run: |
          set -eu
          [[ "$TAG" =~ ^v1\.0\.7-admin\.[0-9]+$ ]]
          docker build -t parser-admin:test .
      - name: Test packaged admin with original dependencies
        run: |
          docker run --rm --network none parser-admin:test python -c "import parser; from importlib.metadata import version; assert version('playwright') == '1.64.1'"
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" parser-admin:test python -m unittest discover -s tests -q
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        run: |
          set -eu
          ref="$IMAGE:${TAG#v}"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "Image already exists: $ref" >&2
            exit 1
          fi
          docker tag parser-admin:test "$ref"
          docker push "$ref"
