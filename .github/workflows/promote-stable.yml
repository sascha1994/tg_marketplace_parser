name: Promote published release to stable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-parser-stable
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/releases'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sascha1994/tg_marketplace_parser
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point stable at the newest published version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          ref="$IMAGE:${tag#v}"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          notes=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          grep -Fq "$IMAGE@$digest" <<< "$notes"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:stable" "$IMAGE@$digest"
          test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:stable")" = "$digest"
          echo "stable = $tag ($digest)" >> "$GITHUB_STEP_SUMMARY"
